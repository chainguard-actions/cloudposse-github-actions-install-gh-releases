name: Test invalid config fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TOOL_CACHE: /tmp/runner-tool-cache
      RUNNER_TEMP: /tmp/runner-temp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create required directories
        run: |
          mkdir -p /tmp/runner-tool-cache
          mkdir -p /tmp/runner-temp

      - name: Run action with invalid config (key without owner/repo format)
        id: action
        uses: .
        continue-on-error: true
        with:
          config: |
            not-a-valid-repo-key:
              tag: v1.0.0

      - name: Assert action failed due to invalid config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed on invalid config"
          else
            echo "FAIL: expected action to fail on invalid config but got outcome '$OUTCOME'"
            exit 1
          fi
